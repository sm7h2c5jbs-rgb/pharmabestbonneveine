<style>
  :root{
    --bg:#FBF6F4; --surface:#FFFFFF; --ink:#2E2840; --muted:#9D9094; --line:#EFE4E2;
    --rose:#E7C4C7; --roseD:#C0848C; --tile:#F6E9E8; --tile2:#F2E7E9; --gold:#BFA06A;
    --serif:'Cormorant Garamond', ui-serif, Georgia, 'Times New Roman', serif;
    --sans:'Jost', -apple-system, BlinkMacSystemFont, ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#F0E9E6; font-family:var(--sans); color:var(--ink);
    display:flex; justify-content:center; -webkit-font-smoothing:antialiased;
  }
  .phone{
    position:relative; width:100%; max-width:430px; background:var(--bg);
    min-height:100vh; min-height:100dvh; overflow:hidden;
    box-shadow:0 0 60px rgba(46,40,64,.10);
  }
  .scroll{
    height:100vh; height:100dvh; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch; padding-bottom:96px;
  }
  .scroll::-webkit-scrollbar{display:none;}
  .scroll{scrollbar-width:none;}

  h1,h2,.serif{font-family:var(--serif); font-weight:500;}
  .px{padding-left:20px; padding-right:20px;}
  .muted{color:var(--muted);}
  .sm{font-size:14px;} .xs{font-size:12px;} .xxs{font-size:10.5px;}
  .ls{letter-spacing:.3px;}

  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .tap{transition:transform .12s ease;}
  .tap:active{transform:scale(.96);}

  /* ---- entrée de vue + stagger ---- */
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .view{animation:fadeUp .42s cubic-bezier(.22,.61,.36,1) both;}

  .tab.on .ic{color:var(--ink); transform:translateY(-1px) scale(1.06);}

  .pbadge{position:absolute; top:-6px; right:-10px; min-width:16px; height:16px; padding:0 4px;

  /* ---- toast ---- */

  var t=document.getElementById("toast");
  t.style.display="flex";
  t.innerHTML='<div class="b"><span style="color:var(--rose)">'+ic("check",15,2.4,"var(--rose)")+'</span>'+msg+'</div>';
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display="none";},2200);
}

/* ============ interactions ============ */
document.querySelector(".phone").addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-wallet],[data-add],.chip");
  if(!el)return;
  if(el.classList.contains("chip")){
    document.querySelectorAll(".chip").forEach(function(c){c.classList.remove("on");});
    el.classList.add("on");return;
  }
  if(el.hasAttribute("data-wallet")){toast("Carte ajoutée à Apple Wallet");return;}
  if(el.hasAttribute("data-add")){state.panier++;toast(el.getAttribute("data-add")+" ajouté au panier");tabbar();return;}
  if(el.hasAttribute("data-tab")){state.tab=el.getAttribute("data-tab");render();}
});

render();
</script>
</body>
</html>
